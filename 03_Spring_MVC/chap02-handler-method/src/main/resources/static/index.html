<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>index</title>
</head>
<body>
    <h1>Chap02. 메소드의 파라미터와 어노테이션</h1>

    <h3>1. WebRequest로 요청 파라미터 전달 받기</h3>
    <button onclick="location.href='/first/regist'">파라미터 전달하기</button>

    <hr/>
    <h3>2. RequestParam 요청 파라미터 전달 받기</h3>
    <button onclick="location.href='/first/modify'">@RequestParam 이동하기</button>
    <hr/>

    <h3>3. ModelAttribute 이용해 파라미터 전달 받기</h3>
    <button onclick="location.href='/first/search'">@ModelAttribute 이동하기</button>

    <h3>4. HttpSession 이용하기 </h3>
    <button onclick="location.href='/first/login'">Session에 정보담기</button>
    <button onclick="location.href='/first/logout'">로그아웃</button>
    <!-- <h3>[Session] 정보</h3>-->
    <!--
    NULL이면 안보여줌
    th:if="조건" : 조건이 참일 때만 이 div를 화면에 그리고, 거짓이면 태그 전체가 사라진다. JS의 if와 비슷하다.

    ${ ... }     : 서버가 넘겨준 값을 꺼내는 Thymeleaf 표현식
    session.id   : 세션에 "id"라는 이름으로 저장된 값 (세션 자체의 ID 번호가 아니라,
                   컨트롤러에서 session.setAttribute("id", ...)로 넣은 값)
    != null      : 값이 있으면, 즉 로그인해서 세션에 id가 담겨 있으면 참
    |...|        : 문자열과 값을 이어 붙이는 문법. ${session.id} + "님 환영합니다."와 같다.
    -->
    <!-- <div th:if="${session.id != null}">
        <p th:text="|${session.id}님 환영합니다.|"></p>
    </div>-->

</body>
</html>
